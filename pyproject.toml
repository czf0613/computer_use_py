[project]
name = "scapkit_computer_use"
version = "0.0.3"
description = "A Python library for computer use"
readme = "README.md"
keywords = ["computer use", "automation"]
authors = [{ name = "Kevin Chen", email = "1354016594@qq.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
]

[project.urls]
Home-page = "https://github.com/czf0613/computer_use_py"

[build-system]
# SPDX license expressions need setuptools 77; 77.0.3 supports Python >=3.9.
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages.find = { where = ["src"] }
include-package-data = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "setuptools>=77.0.3",
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "[%(asctime)s] %(levelname)s %(message)s"
log_cli_date_format = "%Y-%m-%dT%H:%M:%S%z"
