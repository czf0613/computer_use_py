name: Windows backend

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, architecture: x64, python: '3.10', mcp: true}
          - {os: windows-latest, architecture: x64, python: '3.14', mcp: true}
          - {os: windows-latest, architecture: x64, python: '3.13t', mcp: false}
          - {os: windows-latest, architecture: x64, python: '3.14t', mcp: false}
          - {os: windows-11-arm, architecture: arm64, python: '3.14', mcp: true}
          - {os: windows-11-arm, architecture: arm64, python: '3.14t', mcp: false}
    env:
      SCAPKIT_TESTING: '1'
      PYTHONFAULTHANDLER: '1'
      EXPECTED_PLATFORM: ${{ matrix.architecture == 'x64' && 'win-amd64' || 'win-arm64' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - name: Bootstrap uv
        run: python -m pip install uv
      - name: Build with synthetic test hooks
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          uv sync --frozen --python $python
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run --no-sync setup.py build_ext --inplace --force
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run --no-sync python -c "import os,platform,sys,sysconfig; print(platform.machine()); assert sysconfig.get_platform() == os.environ['EXPECTED_PLATFORM']; before=getattr(sys,'_is_gil_enabled',lambda:True)(); import scapkit_computer_use.screen_capture_kit._scapkit; assert not sysconfig.get_config_var('Py_GIL_DISABLED') or (not before and not sys._is_gil_enabled())"
      - name: Test without desktop, input or audio acquisition
        run: uv run --no-sync pytest tests/test_windows_backend.py tests/test_async_safety.py tests/test_recording.py
      # cryptography (an MCP dependency) does not publish Windows ARM64 wheels.
      # Build architecture-matched static libraries, as in pyca/infra's Windows CI.
      - name: Prepare OpenSSL source for ARM64 MCP
        if: matrix.mcp && matrix.architecture == 'arm64'
        shell: pwsh
        run: |
          $version = 'openssl-4.0.2'
          $sha256 = '736b467530f916737b7031310ccb21d8218c6229e61e8e160cd1d3458cd543a8'
          $archive = Join-Path $env:RUNNER_TEMP "$version.tar.gz"
          Invoke-WebRequest "https://github.com/openssl/openssl/releases/download/$version/$version.tar.gz" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $sha256) {
            throw 'OpenSSL source checksum mismatch'
          }
          tar -xzf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "OPENSSL_SOURCE_DIR=$(Join-Path $env:RUNNER_TEMP $version)" >> $env:GITHUB_ENV
          "OPENSSL_DIR=$(Join-Path $env:RUNNER_TEMP 'openssl-arm64')" >> $env:GITHUB_ENV
          'OPENSSL_STATIC=1' >> $env:GITHUB_ENV
      - name: Build static ARM64 OpenSSL for cryptography
        if: matrix.mcp && matrix.architecture == 'arm64'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" arm64
          if errorlevel 1 exit /b 1
          cd /d "%OPENSSL_SOURCE_DIR%"
          perl Configure VC-WIN64-ARM no-zlib no-shared no-module no-comp no-apps no-docs no-tests no-sm2-precomp no-atexit
          if errorlevel 1 exit /b 1
          nmake
          if errorlevel 1 exit /b 1
          mkdir "%OPENSSL_DIR%\lib"
          if errorlevel 1 exit /b 1
          copy libcrypto.lib "%OPENSSL_DIR%\lib\"
          if errorlevel 1 exit /b 1
          copy libssl.lib "%OPENSSL_DIR%\lib\"
          if errorlevel 1 exit /b 1
          xcopy include "%OPENSSL_DIR%\include\" /E /I /Y
          if errorlevel 1 exit /b 1
      - name: Optional MCP with fake devices
        if: matrix.mcp
        shell: pwsh
        run: |
          uv sync --frozen --extra mcp --python (Get-Command python).Source
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run --no-sync pytest tests/test_mcp_server.py tests/test_mcp_recording.py
      - name: Build production wheel without synthetic hooks
        shell: pwsh
        env:
          SCAPKIT_TESTING: '0'
        run: |
          uv run --no-sync setup.py build_ext --inplace --force
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run --no-sync python -c "from scapkit_computer_use.screen_capture_kit import _scapkit; assert not any(n.startswith('_test_') for n in dir(_scapkit))"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv build --wheel --no-build-isolation --python .venv/Scripts/python.exe
